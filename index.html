
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для самой любимой ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffb6d5, #ff80ab, #ffcce0);
}

.card {
    width: 90%;
    max-width: 520px;
    padding: 45px 20px;
    text-align: center;
    background: rgba(255,255,255,.65);
    border: 2px solid white;
    border-radius: 35px;
    box-shadow: 0 15px 50px #d6338460;
    z-index: 2;
}

h1 {
    color: #d63384;
    font-size: clamp(30px, 7vw, 45px);
    margin-bottom: 35px;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
}

button {
    padding: 15px 35px;
    border: none;
    border-radius: 30px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

#yes {
    color: white;
    background: #ff3d8e;
    box-shadow: 0 5px 15px #ff3d8e70;
}

#yes:hover {
    transform: scale(1.12);
}

#no {
    color: #e83e8c;
    background: white;
    position: relative;
}

#message {
    display: none;
    color: #d63384;
    font-size: 24px;
    font-weight: bold;
    line-height: 1.6;
    animation: appear .8s ease;
}

@keyframes appear {
    from {opacity: 0; transform: scale(.5);}
    to {opacity: 1; transform: scale(1);}
}

.heart {
    position: fixed;
    top: -40px;
    pointer-events: none;
    z-index: 1;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(500deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="card">
    <h1 id="question">Ты выйдешь за меня? 💍</h1>

    <div class="buttons" id="buttons">
        <button id="yes">Да ❤️</button>
        <button id="no">Нет 🙈</button>
    </div>

    <div id="message">
        УРААААА! 🥹❤️<br>
        Я самый счастливый человек!<br>
        Теперь ты моя невеста! 💍<br>
        Люблю тебя! 💗
    </div>
</div>

<script>
const no = document.getElementById("no");
const yes = document.getElementById("yes");

function escapeButton() {
    const margin = 15;

    const maxX = window.innerWidth - no.offsetWidth - margin;
    const maxY = window.innerHeight - no.offsetHeight - margin;

    no.style.position = "fixed";
    no.style.left = Math.max(margin, Math.random() * maxX) + "px";
    no.style.top = Math.max(margin, Math.random() * maxY) + "px";
    no.style.zIndex = "10";
}

no.addEventListener("mouseenter", escapeButton);

no.addEventListener("touchstart", function(e) {
    e.preventDefault();
    escapeButton();
});

no.addEventListener("click", escapeButton);

yes.addEventListener("click", function() {
    document.getElementById("question").textContent =
        "ОНА СКАЗАЛА ДАААА! 💍❤️";

    document.getElementById("buttons").style.display = "none";
    document.getElementById("message").style.display = "block";

    for (let i = 0; i < 100; i++) {
        setTimeout(createHeart, i * 35);
    }
});

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";

    const hearts = ["❤️", "💗", "💕", "💖", "💘", "💞"];
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 25) + "px";
    heart.style.animationDuration = (3 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 250);
</script>

</body>
</html>
