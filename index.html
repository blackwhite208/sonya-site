<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Для Сони ❤️</title> <style> body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #ffb6c1, #ffc0cb, #ffe4e1); font-family: Arial, sans-serif; overflow: hidden; } .card { background: rgba(255, 255, 255, 0.85); padding: 60px 40px; border-radius: 30px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.2); max-width: 700px; margin: 20px; } h1 { color: #e75480; font-size: 42px; margin: 0; } p { color: #777; font-size: 20px; margin-top: 25px; } .heart { font-size: 70px; animation: heartbeat 1.3s infinite; } @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } } .flower { position: fixed; font-size: 30px; animation: fall linear infinite; top: -50px; } @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } } </style> </head> <body> <div class="card"> <div class="heart">❤️</div> <h1> Соня, ты самая милая<br> и красивая девушка ❤️ </h1> <p> Просто хотел, чтобы ты это знала ✨ </p> </div> <div class="flower" style="left:10%; animation-duration:7s;">🌸</div> <div class="flower" style="left:25%; animation-duration:9s;">🌷</div> <div class="flower" style="left:45%; animation-duration:6s;">🌸</div> <div class="flower" style="left:65%; animation-duration:8s;">🌷</div> <div class="flower" style="left:85%; animation-duration:10s;">🌸</div> </body> </html>
